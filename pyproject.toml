[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentready"
version = "0.1.0"
description = "一条命令让任何项目对 AI Agent 友好 — 自动生成 AGENTS.md、.cursorrules、MCP 配置、Skill 文件"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "agentready contributors" },
]
keywords = ["ai", "agent", "cli", "developer-tools", "mcp", "claude-code", "cursor", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agentready = "agentready.cli:main"

[project.urls]
Homepage = "https://github.com/LQDC3417/agentready"
Repository = "https://github.com/LQDC3417/agentready"
Issues = "https://github.com/LQDC3417/agentready/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # 行过长（由 formatter 处理）
]

[tool.ruff.lint.isort]
known-first-party = ["agentready"]
